# Workspace root: lets the documented commands run from the repository root
# (`cargo build --release --bin pigeon-server`, `cargo test`).
[workspace]
members = ["core", "clients/linux", "clients/gpui"]
# `cargo build`/`cargo test` at the root stay core-only: the Linux client needs GTK4 and the
# GPUI client pulls a large git dependency, neither of which belongs in the default core
# build. Build them explicitly with `-p pigeon-linux` / `-p pigeon-gpui`.
default-members = ["core"]
resolver = "2"

# Profiles must live in the workspace root, otherwise cargo ignores them.
[profile.release]
lto = true
codegen-units = 1
strip = true
