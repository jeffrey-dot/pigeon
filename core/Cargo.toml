[package]
name = "pigeon-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "pigeon terminal core: VT state, layout, OSC 7501 status, protocol, C ABI"
publish = false

[lib]
name = "pigeon_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "pigeon-host"
path = "src/bin/pigeon-host.rs"

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.23.1"
ciborium = "0.2.2"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
unicode-width = "0.2.2"

[dev-dependencies]
ciborium = "0.2.2"
