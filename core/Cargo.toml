[package]
name = "pigeon-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "pigeon terminal core: VT state, layout, OSC 7501 status, protocol, C ABI"
publish = false

[lib]
name = "pigeon_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "pigeon-host"
path = "src/bin/pigeon-host.rs"
required-features = ["host", "internals"]

# Spawns the pigeon-host binary, which needs the host feature to exist.
[[test]]
name = "host"
path = "tests/host.rs"
required-features = ["host", "internals"]

[features]
default = ["host", "internals"]
# Makes term/layout/status/session/proto public for pigeon-host and the
# integration tests. Clients turn default features off and use `api` only.
internals = []
# Host-only dependencies: the library itself must build without a runtime or a
# PTY, which is what keeps core/ portable and embeddable.
host = ["dep:tokio", "dep:portable-pty"]

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.23.1"
ciborium = "0.2.2"
portable-pty = { version = "0.9.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
tokio = { version = "1.54.1", optional = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
unicode-width = "0.2.2"

[dev-dependencies]
ciborium = "0.2.2"
